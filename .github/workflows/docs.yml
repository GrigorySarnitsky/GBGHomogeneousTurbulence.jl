name: Docs

on:
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

# A new push to the same ref cancels the in-flight build instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      - uses: julia-actions/cache@v3

      # GBGPeriodicFields is a PRIVATE dependency in a separate repo, which the default GITHUB_TOKEN
      # cannot read. Provide a (fine-grained) PAT with read access to GBGPeriodicFields.jl as the
      # repo secret GBG_DEPS_TOKEN; this rewrites the clone URL to authenticate with it.
      - name: Authenticate the private dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.GBG_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install doc environment
        run: |
          julia --color=yes --project=docs -e '
            using Pkg;
            Pkg.add(url="https://github.com/GrigorySarnitsky/GBGPeriodicFields.jl");
            Pkg.develop(PackageSpec(path=pwd()));
            Pkg.instantiate();
          '

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --color=yes --project=docs docs/make.jl

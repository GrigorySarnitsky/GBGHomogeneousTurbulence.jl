# Method-parity baseline, read by GBGCodingTools.TestHarness.method_parity from test/method_parity.jl.
# The package DECLARES method parity to the tool (RULE.TEST.METHOD_PARITY); these are its frozen numbers.
#
# Two baselines, counting DIFFERENT denominators, which must not be compared:
# - [[generic]]: every function on the public surface, by the module that defines methods for it, the
#   set named after that module. A generic several modules extend (`show`, `deposit!`) has one entry
#   per module.
# - [module]: the derived one, every method each module owns over the package's whole function surface,
#   internals included, so adding a method anywhere moves a number.
# A moved number is refrozen deliberately, in the same commit, with the reason written beside it.
# Frozen 2026-09-30 at the declaration. Phenomenology is outside the surface until it is extracted
# (the owner, 2026-09-29), and the HDF5 extension's methods live in their own module and are not counted.

